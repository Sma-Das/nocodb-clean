services:
  - type: web
    name: nocodb-clean-demo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      - key: NC_DB
        sync: false
      - key: NC_DB_POOL_MAX
        value: "5"
      - key: NC_AUTH_JWT_SECRET
        generateValue: true
      - key: NC_SITE_URL
        fromService:
          type: web
          name: nocodb-clean-demo
          envVarKey: RENDER_EXTERNAL_URL
